<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas del motor</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #14181d; color: #e8ecf0; }
    li.pass::marker { content: "✓  "; color: #30d158; }
    li.fail::marker { content: "✗  "; color: #ff453a; }
    li.fail { color: #ff453a; }
    small { color: #9aa5b1; }
  </style>
</head>
<body>
  <h1>Pruebas del motor</h1>
  <p id="sum">Corriendo…</p>
  <ul id="out"></ul>
  <script type="module">
    import { wallPoints, HOLD_TYPES } from '../js/model.js';
    import { generate, evaluateProblem, calibrateAll, bodyModel, DEFAULT_FIT, REF_CLIMBER } from '../js/engine.js';

    const out = document.getElementById('out');
    const results = [];
    function check(name, ok, detail = '') {
      results.push({ name, ok, detail });
      out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'pass' : 'fail'}">${name} <small>${detail}</small></li>`);
    }

    function mulberry32(a) {
      return () => {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Muro sintético: 0,4 cm/px, piso en y = 1150 px (4,6 m de muro), presas en grilla con ruido.
    function syntheticWall(seed, angle = 0) {
      const rng = mulberry32(seed);
      const types = ['cazo', 'cazo', 'pinza', 'regleta', 'regleta', 'bidedo', 'romo', 'volumen'];
      const sizes = ['S', 'M', 'M', 'L'];
      const holds = [];
      let n = 0;
      for (let r = 0; r < 12; r++) {
        for (let c = 0; c < 10; c++) {
          holds.push({
            id: 'h' + n++,
            x: Math.round(60 + c * 95 + (rng() - 0.5) * 60),
            y: Math.round(80 + r * 88 + (rng() - 0.5) * 50),
            type: types[Math.floor(rng() * types.length)],
            size: sizes[Math.floor(rng() * sizes.length)],
          });
        }
      }
      for (let c = 0; c < 12; c++) holds.push({ id: 'h' + n++, x: 40 + c * 80, y: 1080 - Math.round(rng() * 60), type: 'pie', size: 'S' });
      return {
        id: 'test', name: 'Sintético', imgW: 1000, imgH: 1200, angle,
        scale: { cm: 122, a: { x: 100, y: 1140 }, b: { x: 405, y: 1140 } }, floorY: 1150,
        holds, problems: [],
      };
    }

    // Intentos fijos en vez de tiempo, para que las pruebas den lo mismo en cualquier equipo.
    const T = { maxAttempts: 2000, budgetMs: 60000 };
    const climber = { heightCm: 175, wingspanCm: 178 };
    const B = bodyModel(climber);
    const wall = syntheticWall(7);
    const pts = wallPoints(wall);
    const maxH = Math.max(...[...pts.values()].filter(p => p.hand != null).map(p => p.h));

    check('Escala: el muro mide 4,6 m', Math.abs(wall.floorY * 0.4 / 100 - 4.6) < 1e-9);

    const means = {};
    for (const targetV of [1, 3, 5]) {
      const t0 = performance.now();
      const res = generate(wall, climber, DEFAULT_FIT, { targetV, moves: 6, wanted: {}, count: 3, ...T }, mulberry32(targetV + 100));
      const ms = performance.now() - t0;
      if (res.error) { check(`Genera V${targetV}`, false, res.error); continue; }
      check(`Genera V${targetV}`, res.results.length === 3, `${res.results.length} opciones de ${res.tried} candidatos, ${ms.toFixed(0)} ms`);
      check(`V${targetV}: 2000 intentos en menos de 3 s`, ms < 3000, `${ms.toFixed(0)} ms`);
      means[targetV] = res.results.reduce((s, r) => s + r.ev.V, 0) / res.results.length;
      check(`V${targetV}: grado estimado cerca del pedido`, Math.abs(means[targetV] - targetV) <= 1, `promedio V ${means[targetV].toFixed(2)}`);
      for (const [i, r] of res.results.entries()) {
        const nStart = r.startCount === 2 ? 2 : 1;
        const starts = r.handSeq.slice(0, nStart).map(id => pts.get(id));
        const top = pts.get(r.handSeq[r.handSeq.length - 1]);
        const okStart = starts.every(p => p.h >= B.startMin && p.h <= B.startMax);
        const okTop = top.h >= maxH - 0.6;
        const maxD = Math.max(...r.ev.moves.map(m => m.d));
        const okReach = maxD <= B.lanceMax + 1e-9;
        const okUnique = new Set(r.handSeq).size === r.handSeq.length;
        const okFeet = r.feet.every(id => !r.handSeq.includes(id));
        check(`V${targetV} opción ${i + 1}: inicio, top, alcance, presas únicas`, okStart && okTop && okReach && okUnique && okFeet,
          `inicio ${starts.map(p => p.h.toFixed(2)).join('/')} m, top ${top.h.toFixed(2)} m, mov. más largo ${(maxD * 100).toFixed(0)} cm de ${(B.lanceMax * 100).toFixed(0)}`);
      }
    }
    check('Pedir más grado da boulders más duros', means[1] < means[3] && means[3] < means[5],
      `V1→${means[1]?.toFixed(2)}, V3→${means[3]?.toFixed(2)}, V5→${means[5]?.toFixed(2)}`);

    {
      const res = generate(wall, climber, DEFAULT_FIT, { targetV: 3, moves: 6, wanted: { cruce: 1 }, count: 3, ...T }, mulberry32(9));
      const ok = !res.error && res.results.some(r => r.ev.tags.cruce >= 1);
      check('Pedir un cruce da al menos una opción con cruce que no se puede evitar', ok,
        res.error || res.results.map(r => `${r.ev.tags.cruce} cruce(s)`).join(', '));
      const res2 = generate(wall, climber, DEFAULT_FIT, { targetV: 4, moves: 6, wanted: { lance: 1 }, count: 3, ...T }, mulberry32(10));
      check('Pedir un lance da al menos una opción con lance', !res2.error && res2.results.some(r => r.ev.tags.lance >= 1),
        res2.error || res2.results.map(r => `${r.ev.tags.lance} lance(s)`).join(', '));
    }

    // Escalera de presas: la misma secuencia con cazos en vertical y con regletas chicas desplomadas.
    function ladder(type, size, angle) {
      const holds = [];
      for (let i = 0; i < 8; i++) holds.push({ id: 'l' + i, x: 500 + (i % 2 ? 90 : -90), y: 1150 - 250 - i * 105, type, size });
      for (let i = 0; i < 6; i++) holds.push({ id: 'f' + i, x: 500 + (i % 2 ? 60 : -60), y: 1150 - 60 - i * 110, type: 'cazo', size: 'M' });
      return { ...syntheticWall(1, angle), holds };
    }
    const prob = { handSeq: ['l0', 'l1', 'l2', 'l3', 'l4', 'l5', 'l6', 'l7'], startCount: 2, feet: ['f0', 'f1', 'f2', 'f3', 'f4', 'f5'] };
    const easy = evaluateProblem(prob, ladder('cazo', 'L', 0), REF_CLIMBER);
    const hard = evaluateProblem(prob, ladder('regleta', 'S', 40), REF_CLIMBER);
    check('Escalera de cazos grandes en vertical queda en V0 o V1', easy.V <= 1.5, `V ${easy.V.toFixed(2)}, ${easy.moves.length} mov`);
    check('La misma con regletas chicas a 40° queda en V4 o más', hard.V >= 3.5, `V ${hard.V.toFixed(2)}`);
    check('Escalera alterna manos (sin cruces)', easy.tags.cruce === 0, `${easy.tags.cruce} cruces`);

    // Calibración: si el armador gradúa todo 2 grados más duro que el modelo, el ajuste lo aprende.
    {
      const w = syntheticWall(7);
      const gen = generate(w, REF_CLIMBER, DEFAULT_FIT, { targetV: 3, moves: 6, wanted: {}, count: 3, ...T }, mulberry32(3));
      const gen2 = generate(w, REF_CLIMBER, DEFAULT_FIT, { targetV: 5, moves: 7, wanted: {}, count: 3, ...T }, mulberry32(4));
      w.problems = [...gen.results, ...gen2.results].map((r, i) => ({
        id: 'g' + i, source: 'gym', handSeq: r.handSeq, startCount: r.startCount, feet: r.feet, log: [],
        gradeSetter: Math.round(r.ev.V) + 2,
      }));
      const fit = calibrateAll([w]);
      const shift = w.problems.reduce((s, p) => {
        const ev = evaluateProblem(p, w, REF_CLIMBER, fit);
        return s + (ev.V - evaluateProblem(p, w, REF_CLIMBER, DEFAULT_FIT).V);
      }, 0) / w.problems.length;
      check('Calibración aprende un armador 2 grados más duro', fit.n === 6 && Math.abs(shift - 2) < 0.6 && fit.mae < 0.8,
        `n ${fit.n}, corrimiento ${shift.toFixed(2)}, error medio ${fit.mae.toFixed(2)}, a ${fit.a.toFixed(2)}, b ${fit.b.toFixed(2)}`);
    }

    {
      const w = syntheticWall(7);
      w.scale = null;
      check('Sin escala, el generador avisa en vez de fallar', !!generate(w, climber, DEFAULT_FIT, { targetV: 2, moves: 5 }).error);
    }

    const bad = results.filter(r => !r.ok).length;
    document.getElementById('sum').textContent = bad ? `${bad} de ${results.length} pruebas fallaron` : `Las ${results.length} pruebas pasaron`;
    window.__results = results;
  </script>
</body>
</html>
